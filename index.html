
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>BẮN CÁ</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;}
body{background:#0a0a2a;font-family:Arial,sans-serif;color:#fff;overflow:hidden;height:100vh;width:100vw;position:fixed;top:0;left:0;}
.bg{position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(circle at 30% 40%, #0f3a6a, #020512);z-index:0;}
canvas#gameCanvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1;pointer-events:none;}
.ui{position:relative;z-index:2;height:100vh;width:100vw;display:flex;flex-direction:row;padding:6px 12px;gap:10px;pointer-events:none;}
.ui>*{pointer-events:auto;}
.left-panel{flex:2.8;display:flex;flex-direction:column;justify-content:space-between;padding:4px 0;}
.right-panel{flex:0.9;display:flex;flex-direction:column;justify-content:space-between;padding:4px 0;align-items:flex-end;}
.header{display:flex;justify-content:space-between;align-items:center;padding:3px 10px;background:rgba(0,0,0,0.35);border-radius:8px;border:1px solid rgba(255,215,0,0.12);font-size:13px;}
.header .left{color:#ffd700;}
.header .left span{color:#fff;}
.header .right{color:#00ffc3;}
.info-row{display:flex;justify-content:space-between;align-items:center;padding:2px 10px;background:rgba(0,0,0,0.2);border-radius:6px;margin:1px 0;font-size:12px;}
.info-row .label{color:#aaa;}
.info-row .value{color:#ffd700;font-weight:bold;}
.highlight{color:#ff4444;font-weight:bold;}
.mid-row{display:flex;justify-content:space-between;align-items:center;padding:2px 6px;}
.action-buttons{display:flex;flex-wrap:wrap;gap:5px;margin:2px 0;}
.action-buttons button{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);color:#fff;padding:3px 10px;border-radius:14px;font-size:10px;cursor:pointer;font-weight:bold;}
.action-buttons .gold{background:#ffd700;color:#000;border-color:#ffd700;}
.action-buttons .blue{background:#0088ff;color:#fff;}
.action-buttons .pink{background:#ff44aa;color:#fff;}
.action-buttons .green{background:#00cc66;color:#fff;}
.cannon-area{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,0.5);padding:3px 12px;border-radius:30px;border:1px solid #ffd700;}
.cannon-area .power{font-size:20px;font-weight:bold;color:#ffd700;min-width:44px;text-align:center;}
.cannon-area .btn-fire{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#ffd700,#ff8800);color:#000;border:2px solid #fff;font-size:24px;cursor:pointer;box-shadow:0 0 25px rgba(255,215,0,0.3);}
.cannon-area .btn-fire:active{transform:scale(0.85);}
.cannon-area .ammo{font-size:13px;color:#00ffc3;min-width:45px;}
.cannon-area .power-btn{background:rgba(255,255,255,0.1);border:1px solid #ffd700;color:#ffd700;border-radius:50%;width:30px;height:30px;font-size:18px;cursor:pointer;}
.red-packet{background:linear-gradient(135deg,#ff0000,#cc0000);border-radius:50%;width:60px;height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 0 35px rgba(255,0,0,0.5);animation:pulse 1.5s infinite;cursor:pointer;border:2px solid #ffd700;}
.red-packet .text{font-size:9px;color:#fff;font-weight:bold;line-height:1.2;}
.red-packet .text.big{font-size:14px;}
@keyframes pulse{0%{transform:scale(1);}50%{transform:scale(1.05);}100%{transform:scale(1);}}
.bottom-bar{display:flex;justify-content:space-around;padding:3px 0;background:rgba(0,0,0,0.4);border-radius:8px;border-top:1px solid rgba(255,215,0,0.1);}
.bottom-bar .item{text-align:center;font-size:9px;color:#888;cursor:pointer;}
.bottom-bar .item .icon{font-size:18px;display:block;}
.bottom-bar .item.active{color:#ffd700;}
.user-tag{background:rgba(0,0,0,0.4);padding:2px 10px;border-radius:6px;border:1px solid #ffd700;font-size:10px;display:inline-flex;gap:10px;}
.user-tag .name{color:#ffd700;}
.user-tag .score{color:#00ffc3;}
.fish-area{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;}
.fish{position:absolute;font-size:22px;animation:swim linear infinite;pointer-events:none;}
@keyframes swim{0%{transform:translateX(-50px) scaleX(1);}100%{transform:translateX(calc(100vw + 50px)) scaleX(1);}}
.fish.reverse{animation:swim-reverse linear infinite;}
@keyframes swim-reverse{0%{transform:translateX(calc(100vw + 50px)) scaleX(-1);}100%{transform:translateX(-50px) scaleX(-1);}}
.noti{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.85);padding:16px 28px;border-radius:14px;border:2px solid #ffd700;display:none;z-index:20;text-align:center;}
.noti .title{font-size:22px;color:#ffd700;font-weight:bold;}
.noti .sub{font-size:14px;color:#aaa;}
.extras{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.extras span{font-size:11px;color:#aaa;background:rgba(0,0,0,0.3);padding:2px 8px;border-radius:4px;}
</style>
</head>
<body>
<div class="bg"></div>
<div class="fish-area" id="fishArea"></div>
<canvas id="gameCanvas"></canvas>

<div class="ui">
  <!-- LEFT -->
  <div class="left-panel">
    <div class="header">
      <div class="left">💰 <span id="coinDisplay">123.477</span> xu</div>
      <div class="right">🔫 <span id="bulletDisplay">1.183</span></div>
    </div>

    <div class="info-row">
      <span class="label">🎯 Sức bắn</span>
      <span class="value" id="cannonPower">243</span>
    </div>
    <div class="info-row">
      <span class="label">🧧 Hôm nay nhận</span>
      <span class="value">39.142</span>
    </div>

    <div style="display:flex;justify-content:center;gap:12px;padding:2px 0;font-size:14px;">
      <span class="highlight">🔥 QUÁ ĐỈNH!</span>
      <span style="color:#ffd700;">Chúc mừng <span style="color:#ff4444;">【VIP】</span></span>
    </div>

    <div class="action-buttons">
      <button class="gold">🎁 Nhiệm vụ</button>
      <button class="blue">🏪 Cửa hàng</button>
      <button class="pink">📖 Hướng dẫn</button>
      <button class="green">🚀 Tăng tốc</button>
    </div>

    <div style="display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap;">
      <div class="user-tag">
        <span class="name">⚔️ Chiến Binh</span>
        <span class="score">🏆 8.301</span>
        <span class="score">4.700</span>
      </div>
      <div class="extras">
        <span>⚡ <span id="powerDisplay">3.34</span></span>
        <span style="color:#ffd700;">+</span>
        <span style="color:#00ffc3;" id="ammoDisplay2">1.183</span>
      </div>
    </div>

    <div class="bottom-bar">
      <div class="item active"><span class="icon">🏠</span>Trang chủ</div>
      <div class="item"><span class="icon">🛒</span>Cửa hàng</div>
      <div class="item"><span class="icon">📩</span>Hộp thư</div>
      <div class="item"><span class="icon">👤</span>Hồ sơ</div>
    </div>
  </div>

  <!-- RIGHT -->
  <div class="right-panel">
    <div class="red-packet" id="redPacket">
      <span class="text big">🧧</span>
      <span class="text">88 xu</span>
    </div>
    <div style="flex:1;"></div>
    <div class="cannon-area">
      <button class="power-btn" id="powerDown">−</button>
      <span class="power" id="powerDisplay2">3.34</span>
      <button class="power-btn" id="powerUp">+</button>
      <button class="btn-fire" id="btnFire">🔫</button>
      <span class="ammo" id="ammoDisplay">1.183</span>
    </div>
    <div style="height:4px;"></div>
  </div>
</div>

<!-- NOTI -->
<div class="noti" id="noti">
  <div class="title">🎯 BẮN TRÚNG!</div>
  <div class="sub">+200 xu</div>
</div>

<script>
// ===== CANVAS BẮN =====
var canvas = document.getElementById('gameCanvas');
var ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// ===== BONG BÓNG =====
var bubbles = [];
for(var i=0;i<25;i++){
  bubbles.push({x:Math.random()*canvas.width, y:Math.random()*canvas.height, r:2+Math.random()*8, dx:(Math.random()-0.5)*0.3, dy:0.2+Math.random()*0.5});
}

// ===== TIA BẮN =====
var bullets = [];
var explosions = [];

// ===== CÁ =====
var fishEmojis = ['🐟','🐠','🐡','🦈','🐙','🐬','🐳'];
var fishArea = document.getElementById('fishArea');
for(var i=0;i<14;i++){
  var fish=document.createElement('div');
  fish.className='fish' + (Math.random()>0.5?' reverse':'');
  fish.textContent=fishEmojis[Math.floor(Math.random()*fishEmojis.length)];
  fish.style.top=(5+Math.random()*80)+'%';
  fish.style.fontSize=(18+Math.random()*24)+'px';
  fish.style.animationDuration=(14+Math.random()*22)+'s';
  fish.style.animationDelay=(Math.random()*15)+'s';
  fishArea.appendChild(fish);
}

// ===== BIẾN =====
var power = 3.34;
var ammo = 1183;
var coin = 123477;
var autoFire = false;
var autoInterval = null;

function updateUI(){
  document.getElementById('coinDisplay').textContent = coin.toLocaleString();
  document.getElementById('bulletDisplay').textContent = ammo.toLocaleString();
  document.getElementById('ammoDisplay').textContent = ammo.toLocaleString();
  document.getElementById('ammoDisplay2').textContent = ammo.toLocaleString();
  document.getElementById('powerDisplay').textContent = power.toFixed(2);
  document.getElementById('powerDisplay2').textContent = power.toFixed(2);
}

// ===== BẮN =====
function fire(){
  if(ammo <= 0){ alert('💀 Hết đạn!'); return; }
  ammo--;
  
  // TIA BẮN TỪ PHÁO (BÊN PHẢI) BAY SANG TRÁI
  var startX = canvas.width - 80;
  var startY = canvas.height * 0.55;
  var endX = 20 + Math.random() * (canvas.width * 0.6);
  var endY = 20 + Math.random() * (canvas.height * 0.8);
  bullets.push({x:startX, y:startY, targetX:endX, targetY:endY, progress:0, speed:0.08 + Math.random()*0.04});
  
  // TỶ LỆ TRÚNG 70%
  var hit = Math.random() < 0.70;
  
  var earned = 0;
  var noti = document.getElementById('noti');
  if(hit){
    earned = Math.floor(Math.random() * 300) + 50;
    coin += earned;
    noti.querySelector('.title').textContent = '🎯 BẮN TRÚNG!';
    noti.querySelector('.sub').textContent = '+' + earned + ' xu';
    noti.style.borderColor = '#ffd700';
    // HIỆU ỨNG NỔ TẠI ĐIỂM ĐÍCH
    explosions.push({x:endX, y:endY, radius:5, maxRadius:40 + Math.random()*30, progress:0, life:1});
  } else {
    noti.querySelector('.title').textContent = '💨 BẮN TRƯỢT!';
    noti.querySelector('.sub').textContent = '-1 đạn';
    noti.style.borderColor = '#ff4444';
  }
  noti.style.display = 'block';
  setTimeout(function(){ noti.style.display = 'none'; }, 700);
  
  updateUI();
  // TĂNG/GIẢM SỨC BẮN NGẪU NHIÊN
  power = Math.max(0.5, Math.min(10, power + (Math.random()-0.5)*0.2));
  power = Math.round(power*100)/100;
  updateUI();
}

// ===== VẼ =====
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  
  // BONG BÓNG
  ctx.fillStyle='rgba(0,255,200,0.06)';
  for(var i=0;i<bubbles.length;i++){
    var b=bubbles[i];
    b.x+=b.dx; b.y-=b.dy;
    if(b.y<0){b.y=canvas.height; b.x=Math.random()*canvas.width;}
    if(b.x<0||b.x>canvas.width)b.dx=-b.dx;
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fill();
  }
  
  // TIA BẮN
  for(var i=bullets.length-1; i>=0; i--){
    var b = bullets[i];
    b.progress += b.speed;
    if(b.progress >= 1){
      bullets.splice(i,1);
      continue;
    }
    var x = b.x + (b.targetX - b.x) * b.progress;
    var y = b.y + (b.targetY - b.y) * b.progress;
    // VẼ TIA SÁNG
    var grad = ctx.createRadialGradient(x, y, 2, x, y, 20);
    grad.addColorStop(0, 'rgba(255,255,200,0.9)');
    grad.addColorStop(0.3, 'rgba(255,200,100,0.6)');
    grad.addColorStop(1, 'rgba(255,200,100,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(x, y, 20, 0, Math.PI*2);
    ctx.fill();
    // VẼ ĐƯỜNG ĐẠN
    ctx.strokeStyle = 'rgba(255,255,200,0.5)';
    ctx.lineWidth = 3;
    ctx.shadowColor = '#ffd700';
    ctx.shadowBlur = 20;
    ctx.beginPath();
    ctx.moveTo(b.x + (b.targetX - b.x) * (b.progress - 0.02), b.y + (b.targetY - b.y) * (b.progress - 0.02));
    ctx.lineTo(x, y);
    ctx.stroke();
    ctx.shadowBlur = 0;
  }
  
  // VỤ NỔ
  for(var i=explosions.length-1; i>=0; i--){
    var e = explosions[i];
    e.progress += 0.05;
    e.life -= 0.02;
    if(e.life <= 0){ explosions.splice(i,1); continue; }
    var r = e.radius + (e.maxRadius - e.radius) * e.progress;
    var alpha = e.life * 0.8;
    // VÒNG NỔ
    for(var j=0; j<8; j++){
      var angle = (j/8)*Math.PI*2 + e.progress*2;
      var dx = Math.cos(angle) * r * (0.6 + Math.random()*0.4);
      var dy = Math.sin(angle) * r * (0.6 + Math.random()*0.4);
      var grad = ctx.createRadialGradient(e.x+dx, e.y+dy, 1, e.x+dx, e.y+dy, 15);
      grad.addColorStop(0, 'rgba(255,200,50,'+alpha+')');
      grad.addColorStop(1, 'rgba(255,100,0,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(e.x+dx, e.y+dy, 15*e.life, 0, Math.PI*2);
      ctx.fill();
    }
  }
  
  requestAnimationFrame(draw);
}
draw();

// ===== SỰ KIỆN =====
document.getElementById('btnFire').addEventListener('click', fire);

document.getElementById('powerUp').addEventListener('click', function(){
  power = Math.min(10, power + 0.3); power = Math.round(power*100)/100; updateUI();
});
document.getElementById('powerDown').addEventListener('click', function(){
  power = Math.max(0.5, power - 0.3); power = Math.round(power*100)/100; updateUI();
});

document.getElementById('redPacket').addEventListener('click', function(){
  var bonus = Math.floor(Math.random() * 500) + 100;
  coin += bonus; updateUI();
  var noti=document.getElementById('noti');
  noti.style.display='block';
  noti.querySelector('.title').textContent = '🧧 NHẬN LÌ XÌ!';
  noti.querySelector('.sub').textContent = '+' + bonus + ' xu';
  noti.style.borderColor = '#ff4444';
  setTimeout(function(){ noti.style.display='none'; }, 1200);
});

document.querySelector('.action-buttons .green').addEventListener('click', function(){
  autoFire = !autoFire;
  this.style.background = autoFire ? '#ffd700' : '#00cc66';
  this.style.color = autoFire ? '#000' : '#fff';
  if(autoFire){
    autoInterval = setInterval(function(){
      if(!autoFire){ clearInterval(autoInterval); return; }
      fire();
    }, 300);
  } else { clearInterval(autoInterval); }
});

document.addEventListener('keydown', function(e){
  if(e.key === 'ArrowUp'){ power = Math.min(10, power + 0.3); power=Math.round(power*100)/100; updateUI(); }
  if(e.key === 'ArrowDown'){ power = Math.max(0.5, power - 0.3); power=Math.round(power*100)/100; updateUI(); }
  if(e.key === ' '){ e.preventDefault(); fire(); }
});

window.addEventListener('resize', function(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});

updateUI();
</script>
</body>
</html>
